<meta charset="utf-8">
<title>Canon Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a record shop for one maestro at a time. The front room is the crate of maestros (vinyl labels);
   inside, each maestro gets a stage: the career drawn as a waveform, then the catalogue register
   (facets left, ledger middle, liner notes right) and a player dock along the bottom.
   Indigo for the stage lights, brass for gems. Condensed poster type for names, mono for matrices and years. */
:root {
  --bg: #f5f4f8; --panel: #ffffff; --ink: #1b1730; --ink-2: #4a4560; --muted: #767190; --line: #e3e0ec;
  --accent: #4f3fd0; --accent-ink: #ffffff; --accent-soft: #ebe8fb; --hover: #f0eef6;
  --brass: #9a6a12; --brass-soft: #f6ecd8; --stage: #1b1730; --stage-ink: #f3f0ff; --stage-2: #b9b1e6;
  --good: #2e7d32; --warn: #9a6a12; --bad: #c0392b;
  --t-A: #2a78d6; --t-B: #eb6834; --t-C: #1baf7a; --t-D: #eda100; --t-none: #9a98aa;
  --seq-0: #f0eef8; --seq-1: #d8d2f7; --seq-2: #b2a8ef; --seq-3: #8475e2; --seq-4: #5a49cf; --seq-5: #362a95;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --g-expert: #9a6a12; --g-lead: #4f3fd0;
  --r: 8px; --dock-h: 0px;
  --c1: #257de0; --c2: #f47230; --c3: #00b894; --c4: #f2a600; --c5: #ee7fac; --c6: #008a17; --c7: #6a4ce2; --c8: #ec4647;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e0c16; --panel: #17141f; --ink: #ece9f5; --ink-2: #bdb7d0; --muted: #8d87a3; --line: #2a2638;
  --accent: #a99cff; --accent-ink: #140f2b; --accent-soft: #262046; --hover: #1f1b2b;
  --brass: #e2b45a; --brass-soft: #33281a; --stage: #07060c; --stage-ink: #f3f0ff; --stage-2: #a99cff;
  --good: #6bbf6f; --warn: #e2b45a; --bad: #ef6c6c;
  --t-A: #3987e5; --t-B: #d95926; --t-C: #199e70; --t-D: #c98500; --t-none: #6b6880;
  --seq-0: #1b1828; --seq-1: #2f2766; --seq-2: #43389a; --seq-3: #6656d0; --seq-4: #8f80f0; --seq-5: #c4baff;
  --g-expert: #e2b45a; --g-lead: #a99cff;
  --c1: #338ced; --c2: #e76624; --c3: #00a888; --c4: #d28e05; --c5: #e24d8b; --c6: #0aac23; --c7: #9887ef; --c8: #eb6263;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e0c16; --panel: #17141f; --ink: #ece9f5; --ink-2: #bdb7d0; --muted: #8d87a3; --line: #2a2638;
  --accent: #a99cff; --accent-ink: #140f2b; --accent-soft: #262046; --hover: #1f1b2b;
  --brass: #e2b45a; --brass-soft: #33281a; --stage: #07060c; --stage-ink: #f3f0ff; --stage-2: #a99cff;
  --good: #6bbf6f; --warn: #e2b45a; --bad: #ef6c6c;
  --t-A: #3987e5; --t-B: #d95926; --t-C: #199e70; --t-D: #c98500; --t-none: #6b6880;
  --seq-0: #1b1828; --seq-1: #2f2766; --seq-2: #43389a; --seq-3: #6656d0; --seq-4: #8f80f0; --seq-5: #c4baff;
  --g-expert: #e2b45a; --g-lead: #a99cff;
  color-scheme: dark;   --c1: #338ced; --c2: #e76624; --c3: #00a888; --c4: #d28e05; --c5: #e24d8b; --c6: #0aac23; --c7: #9887ef; --c8: #eb6263;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }

/* ---- top bar ---- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.bar1 { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { color: var(--accent); }
.maestros { display: flex; gap: 4px; flex-wrap: wrap; }
.maestros button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-weight: 500; }
.maestros button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.views { margin-left: auto; display: flex; gap: 2px; }
.views a { text-decoration: none; color: var(--ink-2); padding: 5px 10px; border-radius: var(--r); font-weight: 500; }
.views a[aria-current="page"] { color: var(--ink); background: var(--hover); }
.ask { margin-top: 10px; display: flex; gap: 8px; align-items: stretch; }
.ask .field { flex: 1; min-width: 0; position: relative; }
.ask input { width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 9px 12px; font-size: 15px; }
.ask input:focus { border-color: var(--accent); outline: none; }
.fq input, .ftools input { width: 100%; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: var(--r); padding: 8px 12px; font-size: 15px; }
.ftools input { width: 4.6em; padding: 5px 6px; font-size: 13px; }
.fq input:focus, .ftools input:focus { border-color: var(--accent); outline: none; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 6px 12px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn:disabled { opacity: .5; cursor: default; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; min-height: 26px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--accent-soft); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 13px; }
.chip b { font-weight: 600; }
.chip .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.chip button { border: 0; background: transparent; width: 20px; height: 20px; border-radius: 50%; line-height: 1; color: var(--ink-2); }
.chip button:hover { background: var(--hover); }
.hint { font-size: 12.5px; color: var(--muted); }
.hint button { border: 0; background: none; color: var(--accent); padding: 0 2px; text-decoration: underline dotted; }

/* ---- main grid ---- */
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }
.browse { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; }
.browse.has-detail { grid-template-columns: 250px minmax(0, 1fr) 380px; }
.facets { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 130px); max-height: calc(100vh - 150px); overflow: auto; padding-right: 4px; }
.facets summary { display: none; }
.fbody { display: grid; gap: 18px; }
.facet h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--f-body); font-weight: 600; margin-bottom: 6px; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 3px 6px; border-radius: 4px; position: relative; }
.frow:hover { background: var(--hover); }
.frow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; z-index: 1; }
.frow .ct { font-family: var(--f-mono); font-size: 12px; color: var(--muted); position: relative; z-index: 1; }
.frow .fill { position: absolute; left: 0; top: 2px; bottom: 2px; background: var(--accent-soft); border-radius: 3px; }
.frow.on { box-shadow: inset 2px 0 0 var(--accent); font-weight: 600; }
.decades { display: flex; align-items: flex-end; gap: 3px; height: 54px; }
.decades button { flex: 1; border: 0; padding: 0; background: var(--seq-3); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
.decades button:hover, .decades button.on { opacity: 1; background: var(--accent); }
.dlabels { display: flex; gap: 3px; font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
.dlabels span { flex: 1; text-align: center; overflow: hidden; }

.list-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.list-head h2 { font-size: 22px; letter-spacing: -0.01em; }
.list-head .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.list-head select { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 4px 8px; }
.ledger { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; padding: 9px 14px; border-top: 1px solid var(--line); cursor: pointer; align-items: start; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--accent-soft); }
.row .yr { font-family: var(--f-mono); color: var(--ink-2); padding-top: 1px; }
.row .yr .posth { margin-left: 2px; color: var(--muted); }
.row .t { font-weight: 500; overflow-wrap: anywhere; }
.row .alt { color: var(--muted); font-size: 12.5px; }
.row .meta { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere; }
.row .side { display: flex; gap: 8px; align-items: center; }
.ghead { padding: 10px 14px 6px; background: var(--bg); border-top: 1px solid var(--line); font-family: var(--f-display); font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
.ghead:first-child { border-top: 0; }
.ghead .mono { font-size: 12px; color: var(--muted); font-weight: 400; }
.tier { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; border-radius: 4px; font: 600 12px var(--f-mono); color: #fff; background: var(--t-none); }
.tier.A { background: var(--t-A); } .tier.B { background: var(--t-B); } .tier.C { background: var(--t-C); } .tier.D { background: var(--t-D); }
.pop { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.pop .bar { width: 34px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; display: block; }
.pop .bar i { display: block; height: 100%; background: var(--accent); }
.gem { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--warn); border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; line-height: 16px; white-space: nowrap; }
.gem.rare { background: var(--warn); color: var(--panel); border-color: var(--warn); }
.tagbox { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); display: grid; gap: 6px; font-size: 13px; }
.tagbox .btn { justify-self: start; }
.tagbox .why { margin: 0; }
.tagtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 12px; font-size: 12.5px; }
.why { margin: 4px 0 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--ink-2); }
.why li::before { content: "· "; color: var(--muted); }
.facetbars { display: grid; grid-template-columns: 96px minmax(0, 1fr) 30px; gap: 4px 8px; align-items: center; font-size: 12.5px; }
.facetbars .b { height: 6px; border-radius: 3px; background: var(--accent); display: block; }
.lin { display: inline-flex; gap: 2px; }
.lin i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); display: block; }
.lin i.on { background: var(--accent); }
.more { display: block; margin: 12px auto 0; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }

/* person card and Claude answer */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px; }
.card h3 { font-size: 18px; }
.pstats { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 8px; }
.pstats div { display: grid; }
.pstats b { font-family: var(--f-mono); font-size: 18px; font-weight: 500; }
.pstats span { font-size: 12px; color: var(--muted); }
.answer { border-left: 3px solid var(--accent); }
.answer .who { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.answer .txt { white-space: pre-wrap; margin-top: 6px; max-width: 72ch; }
.answer .steps { font-size: 12px; color: var(--muted); margin-top: 6px; }
.linklike { border: 0; background: none; color: var(--accent); padding: 0; text-align: left; }
.linklike:hover { text-decoration: underline; }

/* detail */
.detail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 130px); max-height: calc(100vh - 150px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
.detail .x { float: right; }
.detail h2 { font-size: 20px; line-height: 1.25; margin-right: 40px; overflow-wrap: anywhere; }
.detail .script { font-size: 15px; color: var(--ink-2); margin-top: 4px; }
.detail dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; margin: 14px 0 0; }
.detail dt { color: var(--muted); font-size: 12.5px; padding-top: 1px; }
.detail dd { margin: 0; overflow-wrap: anywhere; }
.detail h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 6px; }
.detail ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.detail .sib { font-size: 13px; }
.detail .sib.me { font-weight: 600; }
.src { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font-size: 13px; }
.media { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.mlink { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 1.3; padding: 4px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); text-decoration: none; background: var(--panel); }
.mlink:hover, .mlink:focus-visible { border-color: currentColor; }
.mlink .k { font-size: 11px; color: var(--muted); }
.mlink.search { border-style: dashed; color: var(--ink-2); background: transparent; }
.medianote { font-size: 12px; color: var(--muted); margin-top: 6px; }
.songlist { margin: 0; padding-left: 22px; display: grid; gap: 10px; }
.songlist li { font-size: 14px; }
.songlist .st { font-weight: 600; }
.songlist .sm { font-size: 13px; margin-top: 2px; }
.songlist .sm .mlink { padding: 1px 8px; font-size: 12px; }
.songlist li.reused .st { color: var(--ink-2); }
.songlist .reuse { font-size: 13px; margin-top: 2px; }
.backdrop { display: none; }

/* insights + coverage */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.panel h2 { font-size: 18px; margin-bottom: 4px; }
.panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.stack { display: grid; gap: 16px; }
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; }
.chart text { fill: var(--muted); font: 10.5px var(--f-mono); }
.chart .gl { stroke: var(--line); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--panel); padding: 6px 9px; border-radius: 5px; font-size: 12.5px; max-width: 280px; }
.heat { display: grid; gap: 2px; font-size: 12.5px; overflow-x: auto; }
.heat .c { height: 24px; border-radius: 3px; border: 0; padding: 0; }
.heat .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 6px; align-self: center; text-align: left; border: 0; background: none; }
.heat .hd { font: 10.5px var(--f-mono); color: var(--muted); text-align: center; align-self: end; }
.tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.tcard h3 { font-size: 16px; display: flex; gap: 8px; align-items: center; }
.tcard .lbl { color: var(--ink-2); font-size: 13px; margin-top: 2px; min-height: 2.9em; }
.big { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
.big div { display: grid; }
.big b { font-family: var(--f-mono); font-size: 22px; font-weight: 500; }
.big span { font-size: 12px; color: var(--muted); }
.track { height: 10px; background: var(--hover); border-radius: 5px; margin-top: 12px; position: relative; overflow: hidden; }
.track .obs { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; border: 1px solid currentColor; white-space: nowrap; }
.pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.info { color: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; font-family: var(--f-mono); }
.tablewrap { overflow-x: auto; }
.lbars { display: grid; gap: 4px; margin-top: 10px; font-size: 12.5px; }
.lbars div { display: grid; grid-template-columns: 110px minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.lbars .b { height: 8px; background: var(--seq-3); border-radius: 0 4px 4px 0; }
.lbars .n { font-family: var(--f-mono); text-align: right; color: var(--ink-2); }
.mapwrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.mapwrap.has-detail { grid-template-columns: minmax(0, 1fr) 380px; }
.mapbox { position: relative; width: 100%; }
.mapbox canvas { display: block; width: 100%; touch-action: manipulation; cursor: crosshair; }
.maptools { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; font-size: 13px; }
.maptools select { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 4px 8px; max-width: 100%; }
.provisional { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--warn); border: 1px dashed currentColor; border-radius: 999px; padding: 1px 8px; }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend .dot.ring { background: transparent !important; border: 2px solid; }
.waves { display: grid; grid-template-columns: minmax(90px, 140px) 1fr; gap: 3px 10px; align-items: center; font-size: 13px; }
.waves .w { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.waves .track { position: relative; height: 14px; }
.waves .span { position: absolute; top: 2px; height: 10px; border-radius: 4px; background: var(--accent); opacity: .85; }
.waves .span.on { background: var(--brass); opacity: 1; }
.waves .axis { position: relative; height: 16px; color: var(--muted); font: 10.5px var(--f-mono); }
.waves .axis span { position: absolute; transform: translateX(-50%); }
.wordchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.wordchips button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
.wordchips button i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.wordchips button:hover { background: var(--hover); }

<script>
"use strict";
// ---------------------------------------------------------------- text helpers
const STOP = new Set(("a an the of all show me list find give any some his her their its by what which who were was are is did do does " +
  "sing sang sung sings recorded record recordings recording songs song tracks track works work pieces piece numbers number " +
  "from in on at for to with and or that this those these he she they it maestro how many much").split(" "));
const SQUASH = [["oo", "u"], ["ee", "i"], ["q", "k"], ["w", "v"], ["ph", "f"], ["aye", "ae"], ["ay", "ai"], ["ai", "e"], ["au", "o"]];
function fold(s) {
  return String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/['"‘’`]/g, "").replace(/[^\p{L}\p{N}\p{M}\s]/gu, " ").replace(/\s+/g, " ").trim();
}
function squash(s) { for (const [a, b] of SQUASH) s = s.split(a).join(b); return s.replace(/(.)\1+/g, "$1"); }

const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`;
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const roleName = r => ({ on_screen: "on screen", assistant_composer: "assistant composer" }[r] || String(r).replace(/_/g, " "));
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

// ---------------------------------------------------------------- state
const S = { index: [], registers: [], cat: [], snaps: {}, slug: null, d: null, f: blank(), view: "home", limit: 150, sel: null, group: "none", answer: null, sample: null, busy: null,
  loading: null, qsets: {}, home: { q: "", role: "", region: "", open: null } };
const MAESTRO_VIEWS = ["overview", "browse", "gems", "map", "insights", "words", "coverage"];
function blank() { return { text: "", yFrom: null, yTo: null, tiers: [], people: [], containers: [], langs: [], perf: null, minLin: null, maxLin: null, live: false, noTier: false, noYear: false, gems: false, sort: "year" }; }

// ---------------------------------------------------------------- loading
async function boot() {
  const getJson = async url => { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); };
  const [idx, cat] = await Promise.all([getJson("canon/index.json").catch(() => ({})), getJson("catalogue.json").catch(() => ({}))]);
  S.index = idx.maestros || [];
  S.registers = idx.registers || [];
  S.cat = cat.maestros || [];
  document.getElementById("v-films").hidden = !S.registers.length;
  if (!S.index.length && S.registers.length && !location.hash) { location.hash = "#films"; return; }
  render();
}
// The maestro to open when a maestro view is asked for and none is loaded: the last one, else the largest canon.
function ensureMaestro() {
  if (S.loading || !S.index.length) return;
  const want = lsGet("maestro");
  selectMaestro(S.index.some(m => m.slug === want) ? want : [...S.index].sort((a, b) => b.units - a.units)[0].slug);
}
async function selectMaestro(slug) {
  S.slug = slug; lsSet("maestro", slug);
  if (!S.snaps[slug]) {
    const m = S.index.find(x => x.slug === slug);
    S.loading = slug; S.d = null;
    renderMaestros();
    if (S.view === "home" || S.view === "films") location.hash = "#overview";
    else document.getElementById("main").innerHTML = loadingHtml(m);
    try {
      const r = await fetch(m.file);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      S.snaps[slug] = prep(await r.json());
    } catch (e) {
      S.loading = null;
      document.getElementById("main").innerHTML = `<div class="empty">Could not load ${esc(m.file)} (${esc(e.message)}). Run maestro-explore again to rewrite it.</div>`;
      return;
    } finally { if (S.loading === slug) S.loading = null; }
    if (S.slug !== slug) return; // another maestro was picked while this one loaded
  }

  const q = document.getElementById("q"); q.value = "";
  q.placeholder = examples(S.d)[0] ? "Try: " + examples(S.d)[0] : "Search titles, people, years…";
  renderMaestros(); render();
}
function addSnapshot(json) {
  const d = prep(json), m = d.maestro;

    const r = await S.sample(prompt, { tools, signal: ctl.signal, onText: ({ text }) => { S.answer.text = text.split(/\n\n/).slice(-1)[0] || text; const el = document.getElementById("anstxt"); if (el) el.textContent = S.answer.text; } });
    S.answer.text = (r.text || "").trim().split(/\n\n(?=\S)/).slice(-2).join("\n\n");
  } catch (e) {
    if (e && e.code === "cancelled") return;
    S.answer.text = e && e.code === "not_granted" ? "Claude is turned off for this page. Plain-words search still works." :
      e && e.code === "rate_limited" ? "Claude is busy right now. Try again in a minute." : `Claude could not answer (${(e && (e.message || e.code)) || "error"}).`;
    if (e && e.code === "not_granted") { S.sample = null; document.getElementById("askbtn").hidden = true; }
  } finally { if (S.busy === ctl) S.busy = null; S.answer.busy = false; render(); }
}

function initials(name) {
  const w = String(name).replace(/[.'’]/g, " ").split(/\s+/).filter(Boolean);
  return (w.length > 1 ? w[0][0] + w[w.length - 1][0] : (w[0] || "?").slice(0, 2)).toUpperCase();

function catFor(m) {

  for (const m of S.index) if (!out.some(x => x.snap === m)) out.push({ name: m.name, roles: m.roles || [], genre: "", country: "", region: "", snap: m });

const lifeYears = x => x.born ? `${x.born}–${x.died || ""}` : "";

// The career as a waveform: one bar per year, mirrored about the centre line; brass dots mark years with gems.
function drawWave(units) {
  const d = S.d, el = document.getElementById("wave"), died = d.maestro.died;
  const ys = units.map(u => u.year).filter(Boolean);
  if (!ys.length) { el.remove(); return; }
  const lo = Math.min(...ys), hi = Math.max(...ys), n = hi - lo + 1, by = {}, gems = {};
  for (const u of units) if (u.year) { by[u.year] = (by[u.year] || 0) + 1; if (u._tag) gems[u.year] = (gems[u.year] || 0) + 1; }
  const max = Math.max(...Object.values(by)), W = 1000, H = 150, mid = 66, half = 58, bw = W / n, gap = Math.min(3, bw * 0.28);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.unitWord)}s per year, ${lo} to ${hi}"><line class="axis" x1="0" x2="${W}" y1="${mid}" y2="${mid}" />`;
  for (let y = lo; y <= hi; y++) {
    const v = by[y] || 0, h = v ? Math.max(2, Math.sqrt(v / max) * half) : 0, x = (y - lo) * bw;
    svg += `<rect class="hot" data-y="${y}" x="${x}" y="0" width="${bw}" height="${mid + half + 2}" />`;
    svg += v ? `<rect class="bar${died && y > died ? " post" : ""}" x="${(x + gap / 2).toFixed(1)}" y="${(mid - h).toFixed(1)}" width="${Math.max(1, bw - gap).toFixed(1)}" height="${(2 * h).toFixed(1)}" rx="${Math.min(2, (bw - gap) / 2).toFixed(1)}" />` : `<rect class="bar" x="0" y="0" width="0" height="0" />`;
    if (gems[y]) svg += `<circle class="gemdot" cx="${(x + bw / 2).toFixed(1)}" cy="${(mid - h - 6).toFixed(1)}" r="2.6" />`;
    const step = n > 60 ? 10 : n > 25 ? 5 : n > 10 ? 2 : 1;
    if (y % step === 0) svg += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${y}</text>`;
  }
  el.innerHTML = svg + `</svg><div class="cap" style="font-size:12px;color:#a49fbf;margin-top:2px">${esc(cap(d.unitWord))}s per year (height grows with the square root of the count). Pick a year to list its ${esc(d.unitWord)}s.${Object.keys(gems).length ? " Brass dots: years with your gems." : ""}${died && hi > died ? ` Paler bars: released after ${died}.` : ""}</div>`;
  el.querySelectorAll("rect.hot").forEach(r => {
    const y = +r.dataset.y;
    r.onmousemove = e => showTip(e, `<b>${y}</b> · ${plural(by[y] || 0, d.unitWord)}${gems[y] ? `<br>${plural(gems[y], "gem")} of yours` : ""}`);
    r.onmouseleave = hideTip;
    r.onclick = () => { hideTip(); S.f = blank(); S.f.yFrom = S.f.yTo = y; location.hash = "#browse"; };
  });
}

// ---------------------------------------------------------------- player
// Units carry outbound media links only (popularity evidence, pack sources); nothing is copied or hosted.
// Served by maestro-explore (or any plain web server) the page plays known videos in place through YouTube's
// privacy-enhanced embed, or Internet Archive's player. Inside claude.ai the frame allows no outside
// embeds, so the same controls open each video on its own site in a new tab.
const PL = { q: [], i: -1, d: null, small: false, embed: !(window.claude && typeof window.claude.use === "function") && /^https?:$/.test(location.protocol) && !/(^|\.)claude(usercontent)?\.(ai|com)$/.test(location.hostname) };
function ytId(url) { const m = String(url).match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/)([\w-]{11})/); return m ? m[1] : null; }

      <div class="chart" id="wchart"></div><div class="sub" id="wmiss" style="margin:6px 0 0"></div></div>
    ${cid ? `<div class="panel"><h2>One idea, many words</h2><div class="sub">Which word ${esc(d.unitWord)}s used for an idea, as a share of all the words for it, pooled over five years. Words are a draft list; some carry other meanings.</div>
      <div style="margin-bottom:10px"><label class="muted" for="wconcept">Idea </label><select id="wconcept">${concepts.map(([k, c]) => `<option value="${esc(k)}"${k === cid ? " selected" : ""}>${esc(c.label)}</option>`).join("")}</select> <span class="muted" style="font-size:12.5px">${esc(wd.concepts[cid].note || "")}</span></div>
      <div class="chart" id="wconc"></div><div class="legend" id="wclegend"></div></div>` : ""}
  </div>`;
  const draw = () => lineChart(document.getElementById("wchart"), picked.filter(k => wd.words[k]).map(k => ({ name: label(k), pts: wordSeries(wd, wd.words[k].years, 1) })), { label: "Share of songs using each word", window: 1, of: d.unitWord + "s" });
  draw();
  if (cid) drawConcept(wd, wd.concepts[cid], d.unitWord);
  main.querySelectorAll("[data-word]").forEach(b => b.onclick = () => { const k = b.dataset.word; if (!picked.includes(k)) picked.push(k); if (picked.length > 8) picked.shift(); render(); });
  main.querySelectorAll("[data-drop]").forEach(b => b.onclick = () => { W.picked[m.slug] = picked.filter(k => k !== b.dataset.drop); render(); });
  document.getElementById("wform").onsubmit = e => {
    e.preventDefault();
    const miss = [];
    for (const raw of document.getElementById("wq").value.split(/[,\s]+/).filter(Boolean)) {
      const k = look[raw.toLowerCase()];
      if (!k) miss.push(raw); else if (!picked.includes(k)) picked.push(k);
    }
    while (picked.length > 8) picked.shift();
    render();
    if (miss.length) document.getElementById("wmiss").textContent = `Not counted: ${miss.join(", ")} (fewer than ${wd.min_songs} ${d.unitWord}s use it, or it is spelt differently).`;
  };
  const sel = document.getElementById("wconcept"); if (sel) sel.onchange = e => { W.concept[m.slug] = e.target.value; render(); };
}
function drawConcept(wd, c, unitWord) {
  const el = document.getElementById("wconc"), lg = document.getElementById("wclegend");
  let words = Object.entries(c.words).map(([w, x]) => ({ w, years: x.years, t: Object.values(x.years).reduce((a, b) => a + b, 0) })).sort((a, b) => b.t - a.t);
  if (words.length > 7) { const rest = words.slice(6), other = {}; for (const r of rest) for (const [y, n] of Object.entries(r.years)) other[y] = (other[y] || 0) + n; words = [...words.slice(0, 6), { w: "other words", years: other, t: rest.reduce((a, r) => a + r.t, 0) }]; }
  const ys = Object.keys(wd.years).map(Number).sort((a, b) => a - b);
  const pts = ys.map(y => { const v = words.map(x => { let n = 0; for (let k = y - 2; k <= y + 2; k++) n += x.years[k] || 0; return n; }); return { y, v, t: v.reduce((a, b) => a + b, 0) }; }).filter(p => p.t >= 10);
  lg.innerHTML = words.map((x, i) => `<span><i style="background:var(${WCOL[i]})"></i>${esc(x.w)} (${x.t})</span>`).join("");
  if (pts.length < 2) { el.innerHTML = `<div class="empty">Too few ${esc(unitWord)}s use these words to chart them.</div>`; return; }
  const lo = pts[0].y, hi = pts[pts.length - 1].y, Wd = Math.max(320, Math.min(el.clientWidth || 800, 1100)), H = 240, L = 44, R = 12, B = 24, T = 10;
  const sx = y => L + (hi === lo ? 0 : (y - lo) / (hi - lo)) * (Wd - L - R), sy = v => H - B - v * (H - B - T);
  let svg = `<svg width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Words for ${esc(c.label)} over time">`;
  for (const v of [0, 0.25, 0.5, 0.75, 1]) svg += `<text x="${L - 6}" y="${sy(v) + 3}" text-anchor="end">${v * 100}%</text>`;
  let acc = pts.map(() => 0);
  words.forEach((x, i) => {
    const lower = acc.slice(), upper = pts.map((p, j) => acc[j] + p.v[i] / p.t);
    let d = pts.map((p, j) => `${j ? "L" : "M"}${sx(p.y).toFixed(1)},${sy(upper[j]).toFixed(1)}`).join("");
    for (let j = pts.length - 1; j >= 0; j--) d += `L${sx(pts[j].y).toFixed(1)},${sy(lower[j]).toFixed(1)}`;
    svg += `<path d="${d}Z" fill="var(${WCOL[i]})" stroke="var(--panel)" stroke-width="1.5" />`;
    acc = upper;
  });
  const every = hi - lo > 40 ? 10 : 5;
  for (let y = Math.ceil(lo / every) * every; y <= hi; y += every) svg += `<text x="${sx(y)}" y="${H - 8}" text-anchor="middle">${y}</text>`;
  svg += `<line id="cx" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--ink)" stroke-dasharray="3 3" visibility="hidden" /><rect id="chit" x="${L}" y="${T}" width="${Wd - L - R}" height="${H - B - T}" fill="transparent" /></svg>`;
  el.innerHTML = svg;
  const hit = el.querySelector("#chit"), cx = el.querySelector("#cx");
  hit.onmousemove = e => {
    const r = hit.getBoundingClientRect(), y = Math.round(lo + (e.clientX - r.left) / r.width * (hi - lo)), p = pts.find(q => q.y === y);
    if (!p) return;
    cx.setAttribute("x1", sx(y)); cx.setAttribute("x2", sx(y)); cx.setAttribute("visibility", "visible");
    showTip(e, `<b>${y}</b> <span class="muted">(${y - 2}–${y + 2}, ${p.t} uses)</span><br>` + words.map((x, i) => `<i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(${WCOL[i]});margin-right:5px"></i>${esc(x.w)}: ${Math.round(p.v[i] / p.t * 100)}% (${p.v[i]})`).join("<br>"));
  };
  hit.onmouseleave = () => { cx.setAttribute("visibility", "hidden"); hideTip(); };
}
initTags();
boot();
</script>
