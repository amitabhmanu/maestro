<meta charset="utf-8">
<title>Canon Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a catalogue register. Query line on top, facets down the left, ledger rows in the middle,
   the record card on the right. Mono for everything a cataloguer would type: years, matrices, counts. */
:root {
  --bg: #f3f5f7; --panel: #ffffff; --ink: #17202b; --ink-2: #485466; --muted: #737e8f; --line: #dde2e8;
  --accent: #0b6870; --accent-ink: #ffffff; --accent-soft: #dcefef; --hover: #eef2f5;
  --good: #2e7d32; --warn: #a76400; --bad: #c0392b;
  --t-A: #2a78d6; --t-B: #eb6834; --t-C: #1baf7a; --t-D: #eda100; --t-none: #9aa3af;
  --seq-0: #eef4fc; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #5598e7; --seq-4: #256abf; --seq-5: #104281;
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1217; --panel: #151a21; --ink: #e5e9ef; --ink-2: #b2bbc7; --muted: #8590a0; --line: #27303b;
  --accent: #4db3ba; --accent-ink: #0b1d1f; --accent-soft: #163538; --hover: #1c232c;
  --good: #6bbf6f; --warn: #e0a030; --bad: #ef6c6c;
  --t-A: #3987e5; --t-B: #d95926; --t-C: #199e70; --t-D: #c98500; --t-none: #6b7480;
  --seq-0: #18202a; --seq-1: #184f95; --seq-2: #1c5cab; --seq-3: #2a78d6; --seq-4: #5598e7; --seq-5: #9ec5f4;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1217; --panel: #151a21; --ink: #e5e9ef; --ink-2: #b2bbc7; --muted: #8590a0; --line: #27303b;
  --accent: #4db3ba; --accent-ink: #0b1d1f; --accent-soft: #163538; --hover: #1c232c;
  --good: #6bbf6f; --warn: #e0a030; --bad: #ef6c6c;
  --t-A: #3987e5; --t-B: #d95926; --t-C: #199e70; --t-D: #c98500; --t-none: #6b7480;
  --seq-0: #18202a; --seq-1: #184f95; --seq-2: #1c5cab; --seq-3: #2a78d6; --seq-4: #5598e7; --seq-5: #9ec5f4;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }

/* ---- top bar ---- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.bar1 { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { color: var(--accent); }
.maestros { display: flex; gap: 4px; flex-wrap: wrap; }
.maestros button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-weight: 500; }
.maestros button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.views { margin-left: auto; display: flex; gap: 2px; }
.views a { text-decoration: none; color: var(--ink-2); padding: 5px 10px; border-radius: var(--r); font-weight: 500; }
.views a[aria-current="page"] { color: var(--ink); background: var(--hover); }
.ask { margin-top: 10px; display: flex; gap: 8px; align-items: stretch; }
.ask .field { flex: 1; min-width: 0; position: relative; }
.ask input { width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 9px 12px; font-size: 15px; }
.ask input:focus { border-color: var(--accent); outline: none; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 6px 12px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn:disabled { opacity: .5; cursor: default; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; min-height: 26px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--accent-soft); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 13px; }
.chip b { font-weight: 600; }
.chip .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.chip button { border: 0; background: transparent; width: 20px; height: 20px; border-radius: 50%; line-height: 1; color: var(--ink-2); }
.chip button:hover { background: var(--hover); }
.hint { font-size: 12.5px; color: var(--muted); }
.hint button { border: 0; background: none; color: var(--accent); padding: 0 2px; text-decoration: underline dotted; }

/* ---- main grid ---- */
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }
.browse { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; }
.browse.has-detail { grid-template-columns: 250px minmax(0, 1fr) 380px; }
.facets { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 130px); max-height: calc(100vh - 150px); overflow: auto; padding-right: 4px; }
.facets summary { display: none; }
.fbody { display: grid; gap: 18px; }
.facet h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--f-body); font-weight: 600; margin-bottom: 6px; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 3px 6px; border-radius: 4px; position: relative; }
.frow:hover { background: var(--hover); }
.frow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; z-index: 1; }
.frow .ct { font-family: var(--f-mono); font-size: 12px; color: var(--muted); position: relative; z-index: 1; }
.frow .fill { position: absolute; left: 0; top: 2px; bottom: 2px; background: var(--accent-soft); border-radius: 3px; }
.frow.on { box-shadow: inset 2px 0 0 var(--accent); font-weight: 600; }
.decades { display: flex; align-items: flex-end; gap: 3px; height: 54px; }
.decades button { flex: 1; border: 0; padding: 0; background: var(--seq-3); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
.decades button:hover, .decades button.on { opacity: 1; background: var(--accent); }
.dlabels { display: flex; gap: 3px; font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
.dlabels span { flex: 1; text-align: center; overflow: hidden; }

.list-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.list-head h2 { font-size: 22px; letter-spacing: -0.01em; }
.list-head .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.list-head select { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 4px 8px; }
.ledger { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; padding: 9px 14px; border-top: 1px solid var(--line); cursor: pointer; align-items: start; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--accent-soft); }
.row .yr { font-family: var(--f-mono); color: var(--ink-2); padding-top: 1px; }
.row .t { font-weight: 500; overflow-wrap: anywhere; }
.row .alt { color: var(--muted); font-size: 12.5px; }
.row .meta { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere; }
.row .side { display: flex; gap: 8px; align-items: center; }
.ghead { padding: 10px 14px 6px; background: var(--bg); border-top: 1px solid var(--line); font-family: var(--f-display); font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
.ghead:first-child { border-top: 0; }
.ghead .mono { font-size: 12px; color: var(--muted); font-weight: 400; }
.tier { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; border-radius: 4px; font: 600 12px var(--f-mono); color: #fff; background: var(--t-none); }
.tier.A { background: var(--t-A); } .tier.B { background: var(--t-B); } .tier.C { background: var(--t-C); } .tier.D { background: var(--t-D); }
.lin { display: inline-flex; gap: 2px; }
.lin i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); display: block; }
.lin i.on { background: var(--accent); }
.more { display: block; margin: 12px auto 0; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }

/* person card and Claude answer */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px; }
.card h3 { font-size: 18px; }
.pstats { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 8px; }
.pstats div { display: grid; }
.pstats b { font-family: var(--f-mono); font-size: 18px; font-weight: 500; }
.pstats span { font-size: 12px; color: var(--muted); }
.answer { border-left: 3px solid var(--accent); }
.answer .who { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.answer .txt { white-space: pre-wrap; margin-top: 6px; max-width: 72ch; }
.answer .steps { font-size: 12px; color: var(--muted); margin-top: 6px; }
.linklike { border: 0; background: none; color: var(--accent); padding: 0; text-align: left; }
.linklike:hover { text-decoration: underline; }

/* detail */
.detail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 130px); max-height: calc(100vh - 150px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
.detail .x { float: right; }
.detail h2 { font-size: 20px; line-height: 1.25; margin-right: 40px; overflow-wrap: anywhere; }
.detail .script { font-size: 15px; color: var(--ink-2); margin-top: 4px; }
.detail dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; margin: 14px 0 0; }
.detail dt { color: var(--muted); font-size: 12.5px; padding-top: 1px; }
.detail dd { margin: 0; overflow-wrap: anywhere; }
.detail h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 6px; }
.detail ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.detail .sib { font-size: 13px; }
.detail .sib.me { font-weight: 600; }
.src { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font-size: 13px; }
.backdrop { display: none; }

/* insights + coverage */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.panel h2 { font-size: 18px; margin-bottom: 4px; }
.panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.stack { display: grid; gap: 16px; }
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; }
.chart text { fill: var(--muted); font: 10.5px var(--f-mono); }
.chart .gl { stroke: var(--line); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--panel); padding: 6px 9px; border-radius: 5px; font-size: 12.5px; max-width: 280px; }
.heat { display: grid; gap: 2px; font-size: 12.5px; overflow-x: auto; }
.heat .c { height: 24px; border-radius: 3px; border: 0; padding: 0; }
.heat .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 6px; align-self: center; text-align: left; border: 0; background: none; }
.heat .hd { font: 10.5px var(--f-mono); color: var(--muted); text-align: center; align-self: end; }
.tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.tcard h3 { font-size: 16px; display: flex; gap: 8px; align-items: center; }
.tcard .lbl { color: var(--ink-2); font-size: 13px; margin-top: 2px; min-height: 2.9em; }
.big { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
.big div { display: grid; }
.big b { font-family: var(--f-mono); font-size: 22px; font-weight: 500; }
.big span { font-size: 12px; color: var(--muted); }
.track { height: 10px; background: var(--hover); border-radius: 5px; margin-top: 12px; position: relative; overflow: hidden; }
.track .obs { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; border: 1px solid currentColor; white-space: nowrap; }
.pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.info { color: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; font-family: var(--f-mono); }
.tablewrap { overflow-x: auto; }
.lbars { display: grid; gap: 4px; margin-top: 10px; font-size: 12.5px; }
.lbars div { display: grid; grid-template-columns: 110px minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.lbars .b { height: 8px; background: var(--seq-3); border-radius: 0 4px 4px 0; }
.lbars .n { font-family: var(--f-mono); text-align: right; color: var(--ink-2); }
.dropzone { max-width: 560px; margin: 60px auto; text-align: center; }
.dropzone h1 { font-size: 30px; margin-bottom: 8px; }
.dropzone p { color: var(--ink-2); }

@media (max-width: 1180px) {
  .browse.has-detail { grid-template-columns: 250px minmax(0, 1fr); }
  .detail { position: fixed; right: 0; top: 0; bottom: 0; width: min(420px, 100%); max-height: none; z-index: 30; border-radius: 0;
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); box-shadow: -8px 0 30px rgba(0,0,0,.18); }
  .backdrop.on { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.25); }
}
@media (max-width: 760px) {
  .browse, .browse.has-detail { grid-template-columns: minmax(0, 1fr); }
  .top { position: static; }
  .facets { position: static; max-height: none; overflow: visible; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
  .facets[open] summary { margin-bottom: 12px; }
  .facets summary { display: block; font-weight: 600; cursor: pointer; }
  .views { margin-left: 0; }
  .row { grid-template-columns: 44px minmax(0, 1fr); }
  .row .side { grid-column: 2; }
}
@media (prefers-reduced-motion: no-preference) { .row, .frow, .btn { transition: background-color .12s; } }
</style>

<header class="top">
  <div class="bar1">
    <div class="brand">maestro <span>canon</span></div>
    <nav class="maestros" id="maestros" aria-label="Maestro"></nav>
    <nav class="views" aria-label="View">
      <a href="#browse" id="v-browse">Browse</a>
      <a href="#insights" id="v-insights">Insights</a>
      <a href="#coverage" id="v-coverage">Coverage</a>
    </nav>
  </div>
  <form class="ask" id="askform" autocomplete="off">
    <div class="field"><input id="q" type="search" aria-label="Search the canon" placeholder="Try: duets with Asha Bhosle composed by O. P. Nayyar in the late 1950s"></div>
    <button class="btn primary" id="askbtn" type="button" hidden>Ask Claude</button>
    <button class="btn" id="clearbtn" type="button">Clear</button>
  </form>
  <div class="chips" id="chips"></div>
</header>
<main id="main"></main>
<div class="backdrop" id="backdrop"></div>
<div class="tip" id="tip" hidden></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
"use strict";
// ---------------------------------------------------------------- text helpers
const STOP = new Set(("a an the of all show me list find give any some his her their its by what which who were was are is did do does " +
  "sing sang sung sings recorded record recordings recording songs song tracks track works work pieces piece numbers number " +
  "from in on at for to with and or that this those these he she they it maestro how many much").split(" "));
const SQUASH = [["oo", "u"], ["ee", "i"], ["q", "k"], ["w", "v"], ["ph", "f"], ["aye", "ae"], ["ay", "ai"], ["ai", "e"], ["au", "o"]];
function fold(s) {
  return String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/['"‘’`]/g, "").replace(/[^\p{L}\p{N}\p{M}\s]/gu, " ").replace(/\s+/g, " ").trim();
}
function squash(s) { for (const [a, b] of SQUASH) s = s.split(a).join(b); return s.replace(/(.)\1+/g, "$1"); }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`;
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const roleName = r => ({ on_screen: "on screen", assistant_composer: "assistant composer" }[r] || String(r).replace(/_/g, " "));
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

// ---------------------------------------------------------------- state
const S = { index: [], snaps: {}, slug: null, d: null, f: blank(), view: "browse", limit: 150, sel: null, group: "none", answer: null, sample: null, busy: null };
function blank() { return { text: "", yFrom: null, yTo: null, tiers: [], people: [], containers: [], langs: [], perf: null, minLin: null, maxLin: null, live: false, noTier: false, noYear: false, sort: "year" }; }

// ---------------------------------------------------------------- loading
async function boot() {
  try {
    const r = await fetch("canon/index.json");
    if (!r.ok) throw new Error(r.status);
    S.index = (await r.json()).maestros || [];
  } catch { S.index = []; }
  if (!S.index.length) return renderDrop();
  const want = lsGet("maestro") ;
  await selectMaestro(S.index.some(m => m.slug === want) ? want : S.index[0].slug);
}
async function selectMaestro(slug) {
  S.slug = slug; lsSet("maestro", slug);
  if (!S.snaps[slug]) {
    const m = S.index.find(x => x.slug === slug);
    renderMaestros();
    document.getElementById("main").innerHTML = `<div class="empty">Loading ${esc(m.name)}'s canon…</div>`;
    try {
      const r = await fetch(m.file);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      S.snaps[slug] = prep(await r.json());
    } catch (e) {
      document.getElementById("main").innerHTML = `<div class="empty">Could not load ${esc(m.file)} (${esc(e.message)}). Run maestro-explore again to rewrite it.</div>`;
      return;
    }
  }
  S.d = S.snaps[slug]; S.f = blank(); S.sel = null; S.answer = null; S.limit = 150;
  const q = document.getElementById("q"); q.value = "";
  q.placeholder = examples(S.d)[0] ? "Try: " + examples(S.d)[0] : "Search titles, people, years…";
  renderMaestros(); render();
}
function addSnapshot(json) {
  const d = prep(json), m = d.maestro;
  S.snaps[m.slug] = d;
  S.index = S.index.filter(x => x.slug !== m.slug).concat([{ slug: m.slug, name: m.name, unit: m.unit, units: d.units.length, file: null }]);
  selectMaestro(m.slug);
}

// Derived fields the page searches and groups on.
function prep(d) {
  const M = d.maestro, me = M.person_id;

  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.unitWord)}s per year">`;
  for (let v = 0; v <= top; v += nice) svg += `<line class="gl" x1="${L}" x2="${W - 4}" y1="${sy(v)}" y2="${sy(v)}" /><text x="${L - 6}" y="${sy(v) + 3}" text-anchor="end">${v}</text>`;
  for (let y = lo; y <= hi; y++) {
    const x = L + (y - lo) * bw; let acc = 0;
    if (y % (n > 40 ? 5 : n > 15 ? 2 : 1) === 0) svg += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${y}</text>`;
    const segs = tiers.filter(t => (by[y] || {})[t]);
    segs.forEach((t, i) => {
      const v = by[y][t], y0 = sy(acc), y1 = sy(acc + v); acc += v;
      const h = Math.max(0, y0 - y1 - (i < segs.length - 1 ? 1 : 0));
      const isTop = i === segs.length - 1, r = isTop ? Math.min(3, bw / 2 - 1, h) : 0;
      const w = Math.max(1, bw - 2), x0 = x + 1;
      svg += isTop && r > 0 ? `<path fill="var(--t-${t || "none"})" d="M${x0},${y0} V${y1 + r} Q${x0},${y1} ${x0 + r},${y1} H${x0 + w - r} Q${x0 + w},${y1} ${x0 + w},${y1 + r} V${y0} Z" />` : `<rect fill="var(--t-${t || "none"})" x="${x0}" y="${y1}" width="${w}" height="${h}" />`;
    });
    svg += `<rect data-y="${y}" x="${x}" y="${T}" width="${bw}" height="${H - B - T}" fill="transparent" style="cursor:pointer" />`;
  }
  svg += `<line x1="${L}" x2="${W - 4}" y1="${H - B}" y2="${H - B}" stroke="var(--muted)" /></svg>`;
  el.innerHTML = svg;
  el.querySelectorAll("rect[data-y]").forEach(r => {
    const y = +r.dataset.y;
    r.onmousemove = e => showTip(e, `<b>${y}</b> · ${plural(tot(y), d.unitWord)}<br>${tiers.filter(t => (by[y] || {})[t]).map(t => `${t ? "Tier " + t : "No tier"}: ${by[y][t]}`).join("<br>")}`);
    r.onmouseleave = hideTip;
    r.onclick = () => { hideTip(); S.f.yFrom = S.f.yTo = y; location.hash = "#browse"; render(); };
  });
}
function drawHeat(res, role) {
  const d = S.d, el = document.getElementById("heat"), me = d.maestro.person_id;
  const top = counts(res, u => (u.credits[role] || []).filter(p => p !== me)).slice(0, 12).map(x => +x[0]);
  const ys = res.map(u => u.year).filter(Boolean);
  if (!top.length || !ys.length) { el.innerHTML = `<div class="empty">Nobody else is credited in this role here.</div>`; return; }
  const lo = Math.floor(Math.min(...ys) / 5) * 5, hi = Math.floor(Math.max(...ys) / 5) * 5, bins = [];
  for (let y = lo; y <= hi; y += 5) bins.push(y);
  const m = {}; let max = 1;
  for (const u of res) if (u.year) for (const p of u.credits[role] || []) if (top.includes(p)) { const k = p + ":" + Math.floor(u.year / 5) * 5; m[k] = (m[k] || 0) + 1; max = Math.max(max, m[k]); }
  const shade = v => v ? `var(--seq-${Math.min(5, 1 + Math.floor(v / max * 4.999))})` : "var(--seq-0)";
  let h = `<div class="heat" style="grid-template-columns: minmax(110px, 170px) repeat(${bins.length}, minmax(26px, 1fr)); min-width:${140 + bins.length * 28}px"><span></span>${bins.map(b => `<span class="hd">${b % 10 === 0 ? b : ""}</span>`).join("")}`;
  for (const p of top) {
    h += `<button class="lbl linklike" data-person="${p}" data-role="${esc(role)}">${esc(pname(p))}</button>`;
    for (const b of bins) { const v = m[p + ":" + b] || 0; h += `<button class="c" type="button" style="background:${shade(v)}" data-hp="${p}" data-hb="${b}" data-v="${v}" aria-label="${esc(pname(p))}, ${b}–${b + 4}: ${v}"></button>`; }
  }
  el.innerHTML = h + "</div>";
  el.querySelectorAll(".c").forEach(c => {
    c.onmousemove = e => showTip(e, `<b>${esc(pname(+c.dataset.hp))}</b><br>${c.dataset.hb}–${+c.dataset.hb + 4}: ${plural(+c.dataset.v, d.unitWord)}`);
    c.onmouseleave = hideTip;
    c.onclick = () => { hideTip(); const b = +c.dataset.hb; S.f.people = [...S.f.people.filter(x => !(x.id === +c.dataset.hp && x.role === role)), { id: +c.dataset.hp, role }]; S.f.yFrom = b; S.f.yTo = b + 4; location.hash = "#browse"; render(); };
  });
}

// ---------------------------------------------------------------- coverage
function renderCoverage() {
  const d = S.d, cov = d.coverage || {}, main = document.getElementById("main");
  const pct = x => (x * 100).toFixed(x < 0.1 ? 1 : 0) + "%";
  const tiers = Object.entries(cov.tiers || {}).filter(([k]) => d.tiers[k]);
  const tierCards = tiers.map(([k, t]) => {
    const target = d.tiers[k].target_missing;
    const est = t.estimate, miss = t.missing_share;
    const pill = target === "report_only" ? `<span class="pill info">report only</span>` : t.meets_target ? `<span class="pill good">✓ meets target</span>` : est == null ? `<span class="pill info">no estimate yet</span>` : `<span class="pill ${miss > 0.15 ? "bad" : "warn"}">! ${pct(miss)} missing, target ${pct(target)}</span>`;
    const bl = Object.entries(t.by_lineage || {}).sort((a, b) => b[1] - a[1]); const blmax = bl.length ? bl[0][1] : 1;
    return `<div class="panel tcard"><h3><span class="tier ${esc(k)}">${esc(k)}</span> Tier ${esc(k)} ${pill}</h3><div class="lbl">${esc(d.tiers[k].label)}</div>
      <div class="big"><div><b>${(t.observed || 0).toLocaleString()}</b><span>found</span></div>${est != null ? `<div><b>~${Math.round(est).toLocaleString()}</b><span>estimated in all</span></div><div><b>${Math.max(0, Math.round(est - t.observed)).toLocaleString()}</b><span>likely missing</span></div>` : ""}</div>
      ${est != null ? `<div class="track" title="${t.observed} of about ${Math.round(est)}"><span class="obs" style="width:${Math.min(100, t.observed / est * 100).toFixed(1)}%"></span></div>` : ""}
      <div class="lbars">${bl.map(([l, n]) => `<div><span>${esc(l)}</span><span class="b" style="width:${(n / blmax * 100).toFixed(1)}%"></span><span class="n">${n}</span></div>`).join("")}</div>
      ${t.method ? `<div class="muted" style="font-size:12px;margin-top:8px">Estimate: ${esc(t.method)}${t.note ? ". " + esc(t.note) : ""}</div>` : ""}
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-apply='${esc(JSON.stringify({ ...blank(), tiers: [k] }))}'>Browse tier ${esc(k)}</button>
      <button class="btn" data-apply='${esc(JSON.stringify({ ...blank(), tiers: [k], maxLin: 1 }))}'>Seen by one lineage only (${d.units.filter(u => u.tier === k && u._lin <= 1).length})</button></div></div>`;
  }).join("");
  const un = cov.tiers && cov.tiers.unassigned;
  const checks = (cov.checksums || []).map(c => {
    const cls = c.status === "ok" || c.status === "match" ? "good" : c.status === "under" ? "warn" : c.status === "over" ? "warn" : "info";
    return `<tr><td>${esc(c.scope)}${c.source ? ` <a href="${esc(c.source)}" target="_blank" rel="noopener noreferrer" class="muted">source</a>` : ""}</td><td class="n">${c.published ?? "–"}</td><td class="n">${c.observed ?? "–"}</td><td class="n">${c.difference != null ? (c.difference > 0 ? "+" : "") + c.difference : "–"}</td><td><span class="pill ${cls}">${esc(c.status || "")}</span></td></tr>`;
  }).join("");
  const cont = cov.containers;
  const lin = [0, 1, 2, 3].map(n => d.units.filter(u => (n === 3 ? u._lin >= 3 : u._lin === n)).length);
  const reviews = Object.entries(cov.open_reviews || {});
  main.innerHTML = `<div class="stack">
    <div class="panel"><h2>How complete is ${esc(d.maestro.name)}'s canon?</h2><div class="sub">Snapshot taken ${esc((d.generated_at || "").replace("T", " ").replace("+00:00", " UTC"))}. Estimates compare what independent source lineages found (capture-recapture); a tier is done when its estimated missing share is under its target.</div>
      <div class="pstats"><div><b>${d.units.length.toLocaleString()}</b><span>${esc(d.unitWord)}s in the canon</span></div>
        ${lin.map((n, i) => n ? `<div><b>${n.toLocaleString()}</b><span>${["no listing source", "one lineage", "two lineages", "three or more"][i]}</span></div>` : "").join("")}
        ${un && un.observed ? `<div><b>${un.observed.toLocaleString()}</b><span>no tier yet <button class="linklike" data-apply='${esc(JSON.stringify({ ...blank(), noTier: true }))}'>browse</button></span></div>` : ""}
        ${reviews.length ? `<div><b>${reviews.reduce((s, [, n]) => s + n, 0)}</b><span>open review questions</span></div>` : ""}</div></div>
    <div class="tiers">${tierCards}</div>
    ${checks ? `<div class="panel"><h2>Published totals</h2><div class="sub">Counts from books and articles, compared with the canon.</div><div class="tablewrap"><table><thead><tr><th>Scope</th><th class="n">Published</th><th class="n">In canon</th><th class="n">Diff</th><th>Status</th></tr></thead><tbody>${checks}</tbody></table></div></div>` : ""}
    ${cont ? `<div class="panel"><h2>${esc(cap(d.contWord))} listings</h2><div class="sub">${cont.containers_with_count.toLocaleString()} ${esc(d.contWord)}s list how many ${esc(d.unitWord)}s they hold; ${cont.mismatched} hold a different number than listed.</div>
      ${cont.examples && cont.examples.length ? `<div class="tablewrap"><table><thead><tr><th>${esc(cap(d.contWord))}</th><th class="n">Listed</th><th class="n">Stored</th></tr></thead><tbody>${cont.examples.map(e => `<tr><td>${d.C[e.container] ? `<button class="linklike" data-cont="${e.container}">${esc(e.label)}</button>` : esc(e.label)}</td><td class="n">${e.listed}</td><td class="n">${e.stored}</td></tr>`).join("")}</tbody></table></div>` : ""}
      ${Object.keys(cont.outside_check || {}).length ? `<h3 style="font-size:14px;margin:14px 0 6px">Other sources inside listed ${esc(d.contWord)}s</h3><div class="tablewrap"><table><thead><tr><th>Source</th><th class="n">Records</th><th class="n">Matched</th><th class="n">Unmatched</th></tr></thead><tbody>${Object.entries(cont.outside_check).map(([s, o]) => `<tr><td>${esc(s)}</td><td class="n">${o.in_listed_containers}</td><td class="n">${o.matched}</td><td class="n">${o.unmatched}</td></tr>`).join("")}</tbody></table></div>` : ""}</div>` : ""}
    ${reviews.length ? `<div class="panel"><h2>Waiting for review</h2><div class="sub">Close calls the resolver could not settle. Run <span class="mono">maestro-review</span> to answer them.</div><div class="tablewrap"><table><tbody>${reviews.map(([k, n]) => `<tr><td>${esc(k.replace(/_/g, " "))}</td><td class="n">${n}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
  </div>`;
  wireMain(main);
}

// ---------------------------------------------------------------- Ask Claude (sample capability)
function answerHtml() {
  const a = S.answer; if (!a) return "";
  return `<div class="card answer"><div class="who">Claude <button class="linklike" id="closeans" style="margin-left:auto;font-size:12px;text-transform:none;letter-spacing:0">Dismiss</button></div>
    <div class="txt" id="anstxt">${esc(a.text || (a.busy ? "Thinking…" : ""))}</div>${a.steps && a.steps.length ? `<div class="steps">${esc(a.steps.join(" · "))}</div>` : ""}</div>`;
}
function wireAnswer() { const c = document.getElementById("closeans"); if (c) c.onclick = () => { if (S.busy) S.busy.abort(); S.answer = null; render(); }; }

function filterFromTool(x) {
  const d = S.d, f = blank();
  if (!x || typeof x !== "object") return f;
  const num = v => (v === null || v === undefined || v === "" || isNaN(+v)) ? null : +v;
  f.text = typeof x.title_contains === "string" ? x.title_contains : "";
  f.yFrom = num(x.year_from); f.yTo = num(x.year_to);
  f.tiers = (Array.isArray(x.tiers) ? x.tiers : []).map(String).filter(t => d.tiers[t]);
  const notFound = [];
  for (const p of Array.isArray(x.people) ? x.people : []) {
    if (!p || typeof p.name !== "string") continue;
    const id = findPersonId(p.name);
    if (id == null) { notFound.push(p.name); continue; }
    let role = typeof p.role === "string" && p.role ? p.role : null;
    if (role === "co_performer" || role === "co") role = d.perfRole;
    f.people.push({ id, role });
  }
  for (const c of Array.isArray(x.containers) ? x.containers : []) { const id = findContainerId(String(c)); if (id != null) f.containers.push(id); else notFound.push(String(c)); }
  f.langs = (Array.isArray(x.languages) ? x.languages : []).filter(l => d.langs.includes(l));
  if (["solo", "duet", "trio", "group"].includes(x.performers)) f.perf = x.performers;
  f.maxLin = num(x.max_lineages); f.minLin = num(x.min_lineages);
  if (x.no_tier === true) f.noTier = true;
  if (["year", "year-desc", "title", "lineages"].includes(x.sort)) f.sort = x.sort;
  f._notFound = notFound;
  return f;
}
function findPersonId(name) {
  const d = S.d, k = fold(name);
  if (d.names.has(k)) return d.names.get(k)[0];
  const m = matchPerson(k.split(" "), 0, d, true);
  return m ? m.id : null;
}
function findContainerId(name) { const d = S.d, k = fold(name); if (d.conts.has(k)) return d.conts.get(k)[0]; const m = matchContainer(k.split(" "), 0, d, true); return m ? m.id : null; }
function brief(u) {
  const d = S.d, me = d.maestro.person_id, c = {};
  for (const [r, ids] of Object.entries(u.credits)) { const o = ids.filter(p => p !== me).map(pname); if (o.length) c[r] = o; }
  return { title: u.title, year: u.year, tier: u.tier, [d.contWord]: u._c ? u._c.title : null, credits: c, lineages: u._lin };
}
const FILTER_SCHEMA = {
  type: "object", properties: {
    title_contains: { type: "string", description: "words that must appear in the title (transliteration-tolerant)" },
    year_from: { type: "integer" }, year_to: { type: "integer" },
    tiers: { type: "array", items: { type: "string" } },
    people: { type: "array", items: { type: "object", properties: { name: { type: "string" }, role: { type: "string", description: "a credit role such as composer, lyricist, director, on_screen, or co_performer; omit for any role" } }, required: ["name"] } },
    containers: { type: "array", items: { type: "string" }, description: "container titles (films, sessions, albums)" },
    languages: { type: "array", items: { type: "string" } },
    performers: { type: "string", enum: ["solo", "duet", "trio", "group"] },
    min_lineages: { type: "integer" }, max_lineages: { type: "integer" }, no_tier: { type: "boolean" },
    sort: { type: "string", enum: ["year", "year-desc", "title", "lineages"] },
  },
};
async function askClaude() {
  const d = S.d, q = document.getElementById("q").value.trim();
  if (!q || !S.sample) return;
  if (S.busy) S.busy.abort();
  const ctl = new AbortController(); S.busy = ctl;
  S.answer = { text: "", busy: true, steps: [] };
  render();
  const me = d.maestro.person_id;
  const topBy = role => counts(d.units, u => (u.credits[role] || []).filter(p => p !== me)).slice(0, 25).map(([p, n]) => `${pname(+p)} (${n})`).join(", ");
  const roles = rolesIn(d, d.units).slice(0, 4);
  const context = {
    maestro: d.maestro.name, unit: d.unitWord, container: d.contWord, performing_role: d.perfRole,
    tiers: Object.fromEntries(Object.entries(d.tiers).map(([k, t]) => [k, t.label])),
    years: [d.yMin, d.yMax], languages: d.langs, units_in_canon: d.units.length,
    frequent_collaborators: Object.fromEntries(roles.map(r => [r, topBy(r)])),
    current_filter: chipList(S.f, d).map(([k, v]) => `${k}: ${v}`),
  };
  const step = s => { S.answer.steps.push(s); const el = document.querySelector(".answer .steps"); if (el) el.textContent = S.answer.steps.join(" · "); else render(); };
  const tools = [
    { name: "find_units", description: `Search ${d.maestro.name}'s canon of ${d.unitWord}s. Returns the count and up to 30 matches.`, inputSchema: FILTER_SCHEMA,
      execute: x => { const f = filterFromTool(x); const r = applyFilter(d, f); step(`searched: ${chipList(f, d).map(c => c[1]).join(", ") || "everything"} → ${r.length}`); return { count: r.length, names_not_found: f._notFound, matches: r.slice(0, 30).map(brief) }; } },
    { name: "count_by", description: "Count matching units grouped by a field: year, decade, tier, language, container, or a credit role (composer, lyricist, co_performer, director, on_screen). Returns the top 30 groups.",
      inputSchema: { type: "object", properties: { filter: FILTER_SCHEMA, by: { type: "string" } }, required: ["by"] },
      execute: x => {
        const f = filterFromTool(x.filter || {}); const r = applyFilter(d, f); let by = String(x.by || "year");
        if (by === "co_performer") by = d.perfRole || by;
        const key = by === "year" ? u => u.year ? [u.year] : [] : by === "decade" ? u => u.year ? [Math.floor(u.year / 10) * 10 + "s"] : [] : by === "tier" ? u => [u.tier || "none"] : by === "language" ? u => u._lang ? [u._lang] : []
          : by === "container" || by === d.contWord ? u => u._c ? [u._c.title] : [] : by === "on_screen" ? u => (u.on_screen || []).map(pname)
          : u => (u.credits[by] || (u._c && u._c.credits && u._c.credits[by]) || []).filter(p => p !== me).map(pname);
        step(`counted by ${by}`);
        return { total: r.length, groups: counts(r, key).slice(0, 30) };
      } },
    { name: "lookup_person", description: "Find people in this canon by (part of) a name, with how often they are credited in each role.",
      inputSchema: { type: "object", properties: { name: { type: "string" } }, required: ["name"] },
      execute: x => { const k = fold(x.name || ""); const hits = Object.entries(d.P).filter(([id, p]) => d.roleCount[id] && [p.name, ...(p.aliases || [])].some(n => fold(n).includes(k))).slice(0, 15); return hits.map(([id, p]) => ({ name: p.name, also: p.aliases, roles: d.roleCount[id] })); } },
    { name: "show_results", description: "Show a filtered list of units to the user in the explorer. Call this once at the end whenever your answer is a set of units.",
      inputSchema: { type: "object", properties: { filter: FILTER_SCHEMA }, required: ["filter"] },
      execute: x => { const f = filterFromTool(x.filter || {}); delete f._notFound; S.f = f; S.limit = 150; const n = applyFilter(d, f).length; step(`showing ${n}`); setTimeout(render, 0); return { shown: n }; } },
  ];
  const prompt = `You help a music researcher explore the canon of ${d.maestro.name}: every ${d.unitWord} in a sourced database. Use the tools to look things up; never answer from memory about what the canon holds. Names in tool input should be written as the canon spells them (see frequent_collaborators, or use lookup_person). When the answer is a set of ${d.unitWord}s, call show_results with the filter so the list appears on the page. Then answer in 1 to 4 plain sentences with the numbers you found. If the canon lacks the data to answer (for example popularity, ragas or lyrics), say so briefly.

Canon context (JSON):
${JSON.stringify(context)}

Question: ${q}`;
  try {
    const r = await S.sample(prompt, { tools, signal: ctl.signal, onText: ({ text }) => { S.answer.text = text.split(/\n\n/).slice(-1)[0] || text; const el = document.getElementById("anstxt"); if (el) el.textContent = S.answer.text; } });
    S.answer.text = (r.text || "").trim().split(/\n\n(?=\S)/).slice(-2).join("\n\n");
  } catch (e) {
    if (e && e.code === "cancelled") return;
    S.answer.text = e && e.code === "not_granted" ? "Claude is turned off for this page. Plain-words search still works." :
      e && e.code === "rate_limited" ? "Claude is busy right now. Try again in a minute." : `Claude could not answer (${(e && (e.message || e.code)) || "error"}).`;
    if (e && e.code === "not_granted") { S.sample = null; document.getElementById("askbtn").hidden = true; }
  } finally { if (S.busy === ctl) S.busy = null; S.answer.busy = false; render(); }
}

// ---------------------------------------------------------------- input wiring
let tmr;
function runQuery() {
  const v = document.getElementById("q").value;
  S.f = v.trim() ? parseQuery(v, S.d) : blank(); S.limit = 150;
  render();
}
document.getElementById("q").addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(runQuery, 160); });
document.getElementById("askform").addEventListener("submit", e => { e.preventDefault(); clearTimeout(tmr); runQuery(); });
document.getElementById("askbtn").onclick = askClaude;
document.getElementById("clearbtn").onclick = () => { document.getElementById("q").value = ""; S.f = blank(); S.answer = null; S.sel = null; render(); };
document.getElementById("backdrop").onclick = () => { S.sel = null; render(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sel != null) { S.sel = null; render(); } if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); document.getElementById("q").focus(); } });
addEventListener("hashchange", render);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 200); });
document.getElementById("file").onchange = async e => { const f = e.target.files[0]; if (!f) return; try { addSnapshot(JSON.parse(await f.text())); } catch (err) { alertBox(`That file is not a canon snapshot (${err.message}).`); } };
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", async e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (!f) return; try { addSnapshot(JSON.parse(await f.text())); } catch (err) { alertBox(`That file is not a canon snapshot (${err.message}).`); } });
function alertBox(msg) { document.getElementById("main").insertAdjacentHTML("afterbegin", `<div class="card" style="border-color:var(--bad)">${esc(msg)}</div>`); }
function renderDrop() {
  renderMaestros();
  document.getElementById("main").innerHTML = `<div class="dropzone"><h1>No canon loaded</h1><p>Write snapshots with <span class="mono">maestro-explore --maestro maestros/&lt;slug&gt;=&lt;dsn&gt;</span> and open this page from that folder, or drop a canon snapshot (<span class="mono">canon/&lt;slug&gt;.json</span>) here.</p><button class="btn primary" type="button" onclick="document.getElementById('file').click()">Open a snapshot…</button></div>`;
}
S.group = lsGet("group") || "none";

if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("sample").then(s => { if (s) { S.sample = s; document.getElementById("askbtn").hidden = false; } }).catch(() => {});
}
boot();
</script>
