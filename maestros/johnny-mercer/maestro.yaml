identity:
  name: Johnny Mercer
  slug: johnny-mercer
  ids: {wikidata: Q363698, musicbrainz: b342d50e-401c-4c77-b7e4-2b3e7beaf00a, viaf: "79167222", isni: "0000000120183877", bnf: "138974071", discogs: "164574"}
  variants: [John Herndon Mercer, John H. Mercer, J. Mercer]
  namesakes: ["Q20127929: British Conservative politician, born 1981"]
  active: [1930, 1976]
  died: 1976
  _why:
    reason: >-
      First published lyric "Out of Breath (and Scared to Death of You)" in The Garrick Gaieties, 1930;
      last new work The Good Companions (London, 1974). MusicBrainz id 95507df9 is merged into b342d50e.
    confidence: 0.9
    evidence: [https://en.wikipedia.org/wiki/Johnny_Mercer, https://www.georgiaencyclopedia.org/articles/arts-culture/johnny-mercer-1909-1976]
roles:
  primary: lyricist
  in_scope: [lyricist, composer, singer]
  out_of_scope: [producer, actor]  # Capitol Records co-founder and radio host: not music contributions
  _why:
    reason: >-
      About 85-90% of his songs are lyrics to others' music, 5-8% words and music, ~5% music to others'
      words (MusicBrainz work credits: lyricist 235, writer 72, composer 52). He was also a hit singer
      (1942-49), so his recordings of songs he did not write are a separate performer tier (D), as for
      Jean Wiener's piano-duo records. Proposed; Amitabh to confirm.
    confidence: 0.7
canon_model:
  unit: work
  version_levels: [work, recording, release]
  container: film
  container_has_full_listing: false
  match_titles_across_containers: true  # most sources give songs without the film or show
  kind_tiers: {stage_song: B, popular_song: B, unpublished: C, posthumous_completion: C, performance_recording: D}
  _why:
    reason: >-
      The song (work) is the unit: hundreds of singers recorded each one. A film is the container for
      about half his output, but no source lists a film's songs completely enough to check the canon
      against (the Hollywood film register's song lists come from Wikipedia and are partial).
    confidence: 0.7
tiers:
  A: {label: "Songs written for films (words, music or both)", target_missing: 0.05}
  B: {label: "Songs for the stage, and songs written for neither film nor stage", target_missing: 0.05}
  C: {label: "Unpublished lyrics and posthumous completions (e.g. Barry Manilow's settings, 1980s on)", target_missing: report_only}
  D: {label: "His own recordings as a singer of songs others wrote (performer)", target_missing: report_only}
