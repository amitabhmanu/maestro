open_questions:
  - "Is his singing in scope? Proposed: his recordings of songs others wrote form tier D (performer), measured but not a target."
  - "Barry Manilow's settings of unfinished lyrics (When October Goes, 1984; ~16 in MusicBrainz): tier C, or out of the canon?"
  - "English lyrics to foreign songs (Autumn Leaves, Summer Wind) and lyrics added to existing instrumentals (Laura, Satin Doll, Midnight Sun) count as his works, credited lyricist only. Agree?"
  - "Can you get The Complete Lyrics (print) for its index? It is the only full register; without it Tier A and B completeness rests on MusicBrainz plus the copyright catalogue."
  - "Stage shows (St. Louis Woman, Li'l Abner and others) have no container type of their own: kept as tier B songs without a container for MVP1."
  - "Films: 'at least 73' (Encyclopedia.com) against '100' (Johnny Mercer Foundation): no checksum until the film register settles it."
