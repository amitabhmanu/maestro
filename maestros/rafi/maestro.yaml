    tiers: [B]
    access: unavailable
    role: partial
    url: https://mohdrafi.com/database/index.php?FILM=Non-Filmi+Ghazals&load=film
    _why:
      reason: >-
        Fan database with categories for non-filmi ghazals, bhajans and songs and for Punjabi, Marathi,
