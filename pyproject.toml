[project]
name = "maestro"
version = "0.1.0"
description = "A Claude Code harness that builds a complete, sourced canon for one specified maestro."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
maestro-mcp = "maestro.mcp_server:main"
maestro-validate = "maestro.cli:validate_main"
maestro-identify = "maestro.profiler.identify:main"
maestro-crawl = "maestro.crawl.cli:main"
maestro-import = "maestro.crawl.cli:import_main"
maestro-replay = "maestro.crawl.cli:replay_main"
maestro-resolve = "maestro.cli:resolve_main"
maestro-review = "maestro.cli:review_main"
maestro-report = "maestro.cli:report_main"
maestro-explore = "maestro.explore:main"
maestro-run = "maestro.cli:run_main"
maestro-score = "maestro.popularity:main"
maestro-migrate = "maestro.ops:migrate_main"
maestro-doctor = "maestro.ops:doctor_main"
maestro-backup = "maestro.ops:backup_main"
maestro-raw = "maestro.rawstore:main"
maestro-lyrics = "maestro.lyrics:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maestro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
